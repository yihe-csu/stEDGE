[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stEDGE"
version = "1.1.2"
description = "Edge-guided multiscale reconstruction of hierarchical spatial domains and transition interfaces in spatial transcriptomics"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Yi He", email = "yihe_csu@csu.edu.cn" }
]

keywords = [
    "spatial transcriptomics",
    "spatial domains",
    "tissue architecture",
    "transition interfaces",
    "gene programs"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "scanpy[skmisc]>=1.10",
    "squidpy>=1.4",
    "networkx>=3.0",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "POT>=0.9",
    "joblib>=1.3",
    "tqdm>=4.66",
    "kneed>=0.8",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/yihe-csu/stEDGE"
Documentation = "https://stedge-tutorials.readthedocs.io/en/latest/"
Repository = "https://github.com/yihe-csu/stEDGE"
Tutorials = "https://github.com/yihe-csu/stEDGE_Tutorials"

[tool.setuptools.packages.find]
include = ["stEDGE*"]
